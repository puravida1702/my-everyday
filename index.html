
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e6">
  <meta name="description" content="My Everyday - A little more organized. A lot more freedom.">
  <title>My Everyday</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div>
        <div class="brand">My Everyday</div>
        <div class="tagline">A little more organized.</div>
      </div>
      <button class="icon-button" id="languageBtn">EN</button>
    </header>

    <main>
      <section class="welcome">
        <div>
          <p class="date" id="todayDate"></p>
          <h1>Make today count.</h1>
          <p class="subtitle">One step at a time.</p>
        </div>
        <div class="sun-icon">☀</div>
      </section>

      <section class="progress-card">
        <div class="progress-circle" id="progressCircle">
          <div>
            <strong id="taskProgress">0/0</strong>
            <span>Tasks done</span>
          </div>
        </div>
        <div class="progress-info">
          <h3>Your daily progress</h3>
          <p id="progressMessage">Let's get started!</p>
          <span id="habitProgress">Habits: 0 completed</span>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Today's tasks</h2>
          <button id="viewAllBtn">View all →</button>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Your everyday life</h2>
        </div>
        <div class="category-grid">
          <button class="category-card" data-category="Personal">
            <span>☑</span><strong>Personal</strong>
          </button>
          <button class="category-card" data-category="Cars">
            <span>🚗</span><strong>Cars</strong>
          </button>
          <button class="category-card" data-category="Home">
            <span>⌂</span><strong>Home</strong>
          </button>
          <button class="category-card" data-category="Projects">
            <span>✎</span><strong>Projects</strong>
          </button>
          <button class="category-card" data-category="Garden">
            <span>❀</span><strong>Garden</strong>
          </button>
          <button class="category-card" data-category="Calendar">
            <span>▦</span><strong>Calendar</strong>
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Daily habits</h2>
          <span class="small-note">Small steps matter</span>
        </div>
        <div id="habitList"></div>
      </section>

      <button class="add-button" id="addTaskBtn">
        + Add a task
      </button>
    </main>

    <nav class="bottom-nav">
      <button class="active" data-page="Home">⌂<small>Home</small></button>
      <button data-page="Tasks">☑<small>Tasks</small></button>
      <button data-page="Calendar">▦<small>Calendar</small></button>
      <button data-page="Organize">▤<small>Organize</small></button>
      <button data-page="More">•••<small>More</small></button>
    </nav>

  </div>
  <script src="app.js"></script>
</body>
</html>
