<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e6">
<meta name="description" content="My Everyday - A little more organized. A lot more freedom.">
<title>My Everyday</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16v-4l2-5h10l2 5v4M3 16h18M7 19v-3M17 19v-3"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4 11-11 3 3L8 19z"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19c3-5 6-7 10-9"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
<symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-timer" viewBox="0 0 24 24"><path d="M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18z"/></symbol>
<symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
</defs></svg>

<div class="app" id="top">
  <header class="topbar">
    <div>
      <div class="brand">My Everyday</div>
      <div class="tagline">A little more organized.</div>
    </div>
    <button class="icon-button" id="languageBtn">EN</button>
  </header>

  <main>
    <section class="welcome">
      <div>
        <p class="date" id="todayDate"></p>
        <h1 id="greeting">Hello</h1>
        <p class="subtitle">Make today count. One step at a time.</p>
      </div>
      <svg class="i sun"><use href="#i-sun"/></svg>
    </section>

    <section class="progress-card">
      <div class="progress-circle" id="progressCircle">
        <div><strong id="taskProgress">0/0</strong><span>Tasks done</span></div>
      </div>
      <div class="progress-info">
        <h3>Your daily progress</h3>
        <p id="progressMessage"></p>
        <span id="habitProgress"></span>
      </div>
    </section>

    <section class="section" id="taskSection">
      <div class="section-heading"><h2>Your tasks</h2></div>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="section">
      <div class="section-heading"><h2>Your everyday life</h2><span class="small-note">Tap to add a task</span></div>
      <div class="category-grid" id="catGrid"></div>
    </section>

    <section class="section" id="habitSection">
      <div class="section-heading"><h2>Daily habits</h2><span class="small-note">Small steps matter</span></div>
      <div id="habitList"></div>
    </section>

    <button class="add-button" id="addTaskBtn"><svg class="i"><use href="#i-plus"/></svg> Add a task</button>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-go="top"><svg class="i"><use href="#i-home"/></svg><small>Home</small></button>
    <button data-go="taskSection"><svg class="i"><use href="#i-list"/></svg><small>Tasks</small></button>
    <button data-go="habitSection"><svg class="i"><use href="#i-pulse"/></svg><small>Habits</small></button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Add a task">
  <div class="sheet-head"><h2>New task</h2><button class="del" id="closeSheet" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <input id="taskName" placeholder="What do you need to do?" maxlength="80" autocomplete="off">
  <p class="label">Area</p>
  <div class="chips" id="catChips"></div>
  <p class="label">When</p>
  <div class="chips" id="dateChips"><button data-d="0">Today</button><button data-d="1">Tomorrow</button><button data-d="">No date</button></div>
  <input type="date" id="taskDate">
  <button class="add-button" id="saveTask">Add task</button>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
